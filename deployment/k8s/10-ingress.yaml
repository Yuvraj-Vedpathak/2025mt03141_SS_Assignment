# Optional API gateway (NGINX Ingress) - 2025MT03141 / Yuvraj Vijay Vedpathak
# Enable with: minikube addons enable ingress
# Then add "<minikube ip> foodexpress.local" to /etc/hosts
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foodexpress-gateway
  namespace: foodexpress
spec:
  ingressClassName: nginx
  rules:
    - host: foodexpress.local
      http:
        paths:
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 3002
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 3003
